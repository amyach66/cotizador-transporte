<script>
let map, directionsService, directionsRenderer;
let lastCalculation = null;

// =========================
// INIT MAP
// =========================
window.initMap = function () {

    const origenInput = document.getElementById("origen");
    const destinoInput = document.getElementById("destino");

    map = new google.maps.Map(document.getElementById("map"), {
        center: { lat: 26.1224, lng: -80.1373 },
        zoom: 10,
    });

    directionsService = new google.maps.DirectionsService();

    directionsRenderer = new google.maps.DirectionsRenderer({
        suppressMarkers: true
    });

    directionsRenderer.setMap(map);

    new google.maps.places.Autocomplete(origenInput);
    new google.maps.places.Autocomplete(destinoInput);

    origenInput.addEventListener("input", calcularRuta);
    destinoInput.addEventListener("input", calcularRuta);

    // recuperar stops
    let stopsFromServer = [];
    try {
        const data = document.getElementById("stops-data").textContent;
        stopsFromServer = JSON.parse(data);
    } catch (e) {
        stopsFromServer = [];
    }

    stopsFromServer.forEach(function(valor) {
        agregarParada(valor);
    });

    actualizarEtiquetas();

    // redibujar ruta si ya hay datos
    setTimeout(function() {
        if (origenInput.value && destinoInput.value) {
            calcularRuta();
        }
    }, 300);
};

// =========================
// GEOLOCATION
// =========================
function usarUbicacion() {
    navigator.geolocation.getCurrentPosition(function(position) {
        const lat = position.coords.latitude;
        const lng = position.coords.longitude;
        document.getElementById("origen").value = lat + "," + lng;
        calcularRuta();
    });
}

// =========================
// STOPS
// =========================
function agregarParada(valor = "") {

    const container = document.getElementById("stops-container");

    const group = document.createElement("div");
    group.className = "input-group";

    const label = document.createElement("span");
    label.className = "label";

    const wrapper = document.createElement("div");
    wrapper.className = "stop-wrapper";

    const input = document.createElement("input");
    input.className = "stop-input";
    input.name = "stops[]";
    input.placeholder = "Stop location";
    input.value = valor;

    const removeBtn = document.createElement("span");
    removeBtn.className = "remove-stop";
    removeBtn.innerText = "✕";

    removeBtn.onclick = function() {
        group.remove();
        actualizarEtiquetas();
        calcularRuta();
    };

    wrapper.appendChild(input);
    wrapper.appendChild(removeBtn);

    group.appendChild(label);
    group.appendChild(wrapper);

    container.appendChild(group);

    new google.maps.places.Autocomplete(input);

    input.addEventListener("input", function() {
        actualizarEtiquetas();
        calcularRuta();
    });

    actualizarEtiquetas();
}

// =========================
// LABELS
// =========================
function actualizarEtiquetas() {
    const stops = document.querySelectorAll("#stops-container .input-group");

    stops.forEach(function(group, index) {
        group.querySelector(".label").innerText =
            String.fromCharCode(66 + index);
    });

    document.getElementById("destino-label").innerText =
        String.fromCharCode(66 + stops.length);
}

// =========================
// ROUTE DRAW
// =========================
function calcularRuta() {

    const origen = document.getElementById("origen").value;
    const destino = document.getElementById("destino").value;

    if (!origen || !destino) return;

    const stops = document.querySelectorAll(".stop-input");

    let waypoints = [];

    stops.forEach(function(stop) {
        if (stop.value) {
            waypoints.push({
                location: stop.value,
                stopover: true
            });
        }
    });

    directionsService.route({
        origin: origen,
        destination: destino,
        waypoints: waypoints,
        travelMode: 'DRIVING'
    }, function(result, status) {
        if (status === 'OK') {
            directionsRenderer.setDirections(result);
        }
    });
}

// =========================
// CALCULATE (NO RELOAD)
// =========================
function handleCalculate() {

    const origen = document.getElementById("origen").value;
    const destino = document.getElementById("destino").value;

    if (!origen || !destino) {
        alert("Enter pickup and dropoff");
        return;
    }

    directionsService.route({
        origin: origen,
        destination: destino,
        travelMode: 'DRIVING'
    }, function(result, status) {

        if (status === 'OK') {

            let totalKm = 0;
            let totalMin = 0;

            result.routes[0].legs.forEach(function(leg) {
                totalKm += leg.distance.value;
                totalMin += leg.duration.value;
            });

            const km = totalKm / 1000;
            const totalMinutes = Math.round(totalMin / 60);

            const now = new Date();
            now.setMinutes(now.getMinutes() + totalMinutes);

            let eta = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

            let precio = 75;

            if (km > 5) {
                let extra = km - 5;

                if (extra <= 95) precio += extra * 2.40;
                else if (extra <= 195) precio += (95 * 2.40) + (extra - 95) * 3.00;
                else if (extra <= 295) precio += (95 * 2.40) + (100 * 3.00) + (extra - 195) * 3.50;
                else precio += (95 * 2.40) + (100 * 3.00) + (100 * 3.50) + (extra - 295) * 4.00;
            }

            if (totalMinutes > 60) {
                precio += (totalMinutes - 60) * 0.5;
            }

            precio = Math.round(precio / 5) * 5;

            lastCalculation = {
                km: km,
                eta: eta,
                price: precio,
                origen: origen,
                destino: destino
            };

            console.log("CALCULATION:", lastCalculation);

            mostrarResultado(km, totalMinutes, eta, precio);
        }
    });
}

// =========================
// SHOW RESULT
// =========================
function mostrarResultado(km, minutos, eta, precio) {

    let hours = Math.floor(minutos / 60);
    let mins = minutos % 60;

    let duracion = "";
    if (hours > 0) duracion += hours + " hr ";
    if (mins > 0) duracion += mins + " min";

    let distancia = (km * 0.621371).toFixed(1);

    const html = `
        <div>Distance: ${distancia} mi</div>
        <div>Duration: ${duracion}</div>
        <div>Arrival: ${eta}</div>
        <div class="price-label">Your Fare</div>
        <div class="price-value">$${precio}</div>
    `;

    let box = document.querySelector(".resultado");

    if (!box) {
        box = document.createElement("div");
        box.className = "resultado";
        document.querySelector(".form-section").appendChild(box);
    }

    box.innerHTML = html;
}

// =========================
// BOOKING
// =========================
function handleBooking() {

    console.log("BOOKING:", lastCalculation);

    if (!lastCalculation || !lastCalculation.price) {
        alert("Please calculate price first");
        return;
    }

    const nombre = document.querySelector('[name="nombre_cliente"]').value;
    const telefonoCliente = document.querySelector('[name="telefono_cliente"]').value;
    const flightNumber = document.querySelector('[name="flight_number"]').value;
    const fecha = document.querySelector('[name="fecha"]').value;
    const hora = document.querySelector('[name="hora"]').value;

    if (!nombre || !telefonoCliente || !fecha || !hora) {
        alert("Complete all fields");
        return;
    }

    const mensaje = 
`🚐 *New Booking Request*

👤 Name: ${nombre}
📞 Phone: ${telefonoCliente}
✈️ Flight: ${flightNumber || "N/A"}

📍 Pickup: ${lastCalculation.origen}
📍 Dropoff: ${lastCalculation.destino}

📅 Date: ${fecha}
⏰ Time: ${hora}

🛣 Distance: ${lastCalculation.km.toFixed(1)} km
🕒 ETA: ${lastCalculation.eta}

💲 Price: $${lastCalculation.price}

Please confirm availability.`;

    const telefono = "15615601688";

    const url = `https://wa.me/${telefono}?text=${encodeURIComponent(mensaje)}`;

    window.open(url, "_blank");
}
</script>

<script async defer
src="https://maps.googleapis.com/maps/api/js?key=AIzaSyASKSqaSVc6WiZdhkN9mnTDEx5_AwDo2y8&libraries=places&callback=initMap">
</script>

</body>
</html>
