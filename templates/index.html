<!DOCTYPE html>
<html>
<head>
    <title>Amyach Logistics</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container horizontal">
    <div class="card horizontal-card">

        <div class="form-section">

            <div class="branding">
                <h1>Amyach Logistics</h1>
                <p>Luxury Ride Quote</p>
            </div>

            <form method="POST" id="quoteForm">

                <!-- 🔥 SIN value="{{ }}" -->
                <div class="input-group">
                    <span class="label">A</span>
                    <input id="origen" name="origen" placeholder="Pickup location" required>
                </div>

                <div id="stops-container"></div>

                <div class="input-group">
                    <span class="label" id="destino-label">B</span>
                    <input id="destino" name="destino" placeholder="Dropoff location" required>
                </div>

                <button type="button" onclick="agregarParada()">➕ Add Stop</button>

                <div class="input-group">
                    <input type="text" name="nombre_cliente" placeholder="Your name" required>
                </div>

                <div class="input-group">
                    <input type="tel" name="telefono_cliente" placeholder="Your phone number" required>
                </div>

                <div class="input-group" style="flex-direction: column; align-items: flex-start;">
                    <label style="font-size: 12px; color: #9ca3af;">Select Date</label>
                    <input type="date" name="fecha" required>
                </div>

                <div class="input-group" style="flex-direction: column; align-items: flex-start;">
                    <label style="font-size: 12px; color: #9ca3af;">Select Time</label>
                    <input type="time" name="hora" required>
                </div>

                <button type="button" onclick="handleCalculate()">Calculate Price</button>
                <button type="button" onclick="handleBooking()">Request Booking</button>

            </form>

            <div class="resultado" id="resultadoBox"></div>

        </div>

        <div class="map-section">
            <div id="map"></div>
        </div>

    </div>
</div>

<script>
let map, directionsService, directionsRenderer;
let lastCalculation = null;

// =========================
// RESET TOTAL AL CARGAR
// =========================
window.addEventListener("load", function () {

    document.getElementById("quoteForm").reset();
    document.getElementById("stops-container").innerHTML = "";
    document.getElementById("resultadoBox").innerHTML = "";

    lastCalculation = null;
});

// =========================
// INIT MAP
// =========================
window.initMap = function () {

    const origenInput = document.getElementById("origen");
    const destinoInput = document.getElementById("destino");

    map = new google.maps.Map(document.getElementById("map"), {
        center: { lat: 26.1224, lng: -80.1373 },
        zoom: 10,
    });

    directionsService = new google.maps.DirectionsService();

    directionsRenderer = new google.maps.DirectionsRenderer({
        suppressMarkers: true
    });

    directionsRenderer.setMap(map);

    new google.maps.places.Autocomplete(origenInput);
    new google.maps.places.Autocomplete(destinoInput);

    origenInput.addEventListener("input", calcularRuta);
    destinoInput.addEventListener("input", calcularRuta);
};

// =========================
// STOPS
// =========================
function agregarParada(valor = "") {

    const container = document.getElementById("stops-container");

    const group = document.createElement("div");
    group.className = "input-group";

    const label = document.createElement("span");
    label.className = "label";

    const wrapper = document.createElement("div");
    wrapper.className = "stop-wrapper";

    const input = document.createElement("input");
    input.className = "stop-input";
    input.name = "stops[]";
    input.placeholder = "Stop location";
    input.value = valor;

    const removeBtn = document.createElement("span");
    removeBtn.className = "remove-stop";
    removeBtn.innerText = "✕";

    removeBtn.onclick = function() {
        group.remove();
        actualizarEtiquetas();
        calcularRuta();
    };

    wrapper.appendChild(input);
    wrapper.appendChild(removeBtn);

    group.appendChild(label);
    group.appendChild(wrapper);

    container.appendChild(group);

    new google.maps.places.Autocomplete(input);

    input.addEventListener("input", () => {
        actualizarEtiquetas();
        calcularRuta();
    });

    actualizarEtiquetas();
}

// =========================
// LABELS
// =========================
function actualizarEtiquetas() {
    const stops = document.querySelectorAll("#stops-container .input-group");

    stops.forEach((group, index) => {
        group.querySelector(".label").innerText = String.fromCharCode(66 + index);
    });

    document.getElementById("destino-label").innerText =
        String.fromCharCode(66 + stops.length);
}

// =========================
// ROUTE
// =========================
function calcularRuta() {

    const origen = document.getElementById("origen").value;
    const destino = document.getElementById("destino").value;

    if (!origen || !destino) return;

    const stops = document.querySelectorAll(".stop-input");

    let waypoints = [];

    stops.forEach(stop => {
        if (stop.value) {
            waypoints.push({ location: stop.value, stopover: true });
        }
    });

    directionsService.route({
        origin: origen,
        destination: destino,
        waypoints: waypoints,
        travelMode: 'DRIVING'
    }, function(result, status) {
        if (status === 'OK') directionsRenderer.setDirections(result);
    });
}

// =========================
// CALCULATE
// =========================
function handleCalculate() {

    const origen = document.getElementById("origen").value;
    const destino = document.getElementById("destino").value;

    if (!origen || !destino) return;

    const stops = document.querySelectorAll(".stop-input");

    let waypoints = [];

    stops.forEach(stop => {
        if (stop.value) {
            waypoints.push({ location: stop.value, stopover: true });
        }
    });

    directionsService.route({
        origin: origen,
        destination: destino,
        waypoints: waypoints,
        travelMode: 'DRIVING'
    }, function(result, status) {

        if (status === 'OK') {

            let totalKm = 0;
            let totalMin = 0;

            result.routes[0].legs.forEach(leg => {
                totalKm += leg.distance.value;
                totalMin += leg.duration.value;
            });

            const km = totalKm / 1000;
            const minutes = Math.round(totalMin / 60);
            const miles = km * 0.621371;

            let price = 75;

            if (km > 5) {
                let extra = km - 5;
                if (extra <= 95) price += extra * 2.40;
                else if (extra <= 195) price += (95*2.40) + (extra-95)*3;
                else if (extra <= 295) price += (95*2.40)+(100*3)+(extra-195)*3.5;
                else price += (95*2.40)+(100*3)+(100*3.5)+(extra-295)*4;
            }

            if (minutes > 60) price += (minutes - 60) * 0.5;

            price = Math.round(price / 5) * 5;

            lastCalculation = { km, miles, minutes, price };

            mostrarResultado(km, minutes, price);
        }
    });
}

// =========================
// RESULT
// =========================
function mostrarResultado(km, minutos, price) {

    let dist = (km * 0.621371).toFixed(1);

    document.getElementById("resultadoBox").innerHTML = `
        <div>Distance: ${dist} mi</div>
        <div>Duration: ${formatDuration(minutos)}</div>
        <div class="price-label">Your Fare</div>
        <div class="price-value">$${price}</div>
    `;
}

function formatDuration(minutos) {
    const hours = Math.floor(minutos / 60);
    const mins = minutos % 60;

    let result = "";
    if (hours > 0) result += `${hours}h `;
    if (mins > 0) result += `${mins} min`;

    return result.trim();
}

// =========================
// BOOKING
// =========================
function handleBooking() {

    if (!lastCalculation) {
        alert("Please calculate price first");
        return;
    }

    const nombre = document.querySelector('[name="nombre_cliente"]').value.trim();
    const telefonoCliente = document.querySelector('[name="telefono_cliente"]').value.trim();
    const fecha = document.querySelector('[name="fecha"]').value;
    const hora = document.querySelector('[name="hora"]').value;

    const origen = document.getElementById("origen").value.trim();
    const destino = document.getElementById("destino").value.trim();

    if (!nombre || !telefonoCliente || !fecha || !hora || !origen || !destino) {
        alert("Please complete all fields");
        return;
    }

    const stops = document.querySelectorAll(".stop-input");

    let ruta = `A: ${origen}\n`;
    let letra = 66;

    stops.forEach(stop => {
        if (stop.value) {
            ruta += `${String.fromCharCode(letra)}: ${stop.value}\n`;
            letra++;
        }
    });

    ruta += `${String.fromCharCode(letra)}: ${destino}`;

    const mensaje = 
`🚐 *New Booking Request*

👤 Name: ${nombre}
📞 Phone: ${telefonoCliente}

🗺 Route:
${ruta}

📅 Date: ${fecha}
⏰ Time: ${hora}

🛣 Distance: ${lastCalculation.miles.toFixed(1)} mi
🕒 Total Time: ${formatDuration(lastCalculation.minutes)}

💲 Price: $${lastCalculation.price}

Please confirm availability.`;

    window.open(`https://wa.me/15615601688?text=${encodeURIComponent(mensaje)}`);
}
</script>

<script async defer
src="https://maps.googleapis.com/maps/api/js?key=AIzaSyASKSqaSVc6WiZdhkN9mnTDEx5_AwDo2y8&libraries=places&callback=initMap">
</script>

</body>
</html>
